<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawns of War 存档工具（离线 Web 版）</title>
<style>
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --line: #d4d9e0;
  --line-strong: #b9c1cc;
  --text: #1d232b;
  --muted: #6a7480;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --green: #15803d;
  --red: #b91c1c;
  --amber: #b45309;
  --code: #2d3642;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button {
  padding: 7px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:hover:not(:disabled) { background: var(--blue-dark); color: #fff; }
button.danger { color: var(--red); }
button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
button:disabled { opacity: .5; cursor: not-allowed; }
.save-safety { margin-left: auto; font-weight: 700; }
.save-safety.ok { color: var(--green); }
.save-safety.err { color: var(--red); }
input[type=text], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 7px 9px;
  background: #fff;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid rgba(37, 99, 235, .28);
  border-color: var(--blue);
}
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--blue); }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px 18px;
  background: #1f2937;
  color: #f3f4f6;
}
.brand h1 { font-size: 18px; margin: 0; font-weight: 700; }
.brand .sub { display: block; margin-top: 2px; font-size: 12px; color: #9ca3af; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.top-actions select { background: #374151; color: #f3f4f6; border-color: #4b5563; }
.statusbar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: baseline;
  padding: 7px 18px;
  background: #f8fafc;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  min-height: 31px;
}
#status { color: var(--muted); word-break: break-all; }
#status.ok { color: var(--green); }
#status.err { color: var(--red); }
#stats { color: var(--muted); white-space: nowrap; }
.tabs {
  display: flex;
  gap: 2px;
  padding: 10px 18px 0;
  background: var(--bg);
}
.tab-btn {
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  background: #e4e8ee;
  color: var(--muted);
}
.tab-btn.active {
  background: var(--panel);
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 -1px 0 var(--line-strong);
}
main { padding: 0 18px 34px; max-width: 1440px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding-top: 14px; }
.stat-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-num { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-label { color: var(--muted); font-size: 12px; }
.issues {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 12px;
  max-height: 220px;
  overflow: auto;
}
.issues h3 { margin: 0 0 8px; font-size: 13px; }
.issues ul { margin: 0; padding-left: 20px; }
.issues li { margin: 2px 0; font-size: 12px; }
.issues li.err { color: var(--red); }
.issues li.warn { color: var(--amber); }
.ok-line { color: var(--green); font-size: 13px; }
.editor-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
}
.editor-head, .list-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.editor-head h2, .list-head h2 { margin: 0; font-size: 16px; }
.muted { color: var(--muted); font-size: 12px; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input[type=text], .field input[type=number], .field select { width: 100%; }
.field input[type=checkbox] { align-self: flex-start; }
.vec4 { display: flex; gap: 4px; }
.vec4 input { width: 72px; }
.detail-actions { display: flex; gap: 8px; margin-top: 12px; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  margin-top: 12px;
}
#searchInput { width: 230px; }
.page-info { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.table-wrap {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-top: 10px;
  overflow: auto;
  max-height: 430px;
}
table { border-collapse: collapse; width: 100%; }
th, td {
  padding: 6px 9px;
  border-bottom: 1px solid #e6e9ee;
  text-align: left;
  font-size: 12px;
  white-space: nowrap;
}
th {
  position: sticky;
  top: 0;
  background: #f1f4f8;
  z-index: 2;
  font-weight: 600;
  color: var(--muted);
}
tbody tr { cursor: pointer; }
tbody tr:hover { background: #f4f7fb; }
tbody tr.selected { background: #e3edff; }
tbody tr.selected:hover { background: #dce8fc; }
td.empty { text-align: center; color: var(--muted); padding: 26px; }
td.num { font-variant-numeric: tabular-nums; }
.detail-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin-top: 10px;
}
.detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.detail-head h3 { margin: 0; font-size: 15px; }
.slot-tag {
  background: #eef2f7;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11px;
  color: var(--muted);
}
.detail-empty { color: var(--muted); padding: 8px 2px; }
.mini { padding: 4px 8px; font-size: 12px; }
.field-wide { grid-column: span 2; }
#rawArea {
  width: 100%;
  min-height: 62vh;
  resize: vertical;
  font: 12px/1.5 Consolas, "Courier New", monospace;
  margin-top: 10px;
  background: #fbfcfe;
}
#panel-raw .toolbar { margin-top: 0; }
@media (max-width: 760px) {
  .topbar { flex-direction: column; align-items: stretch; }
  .top-actions { justify-content: flex-start; }
  #searchInput { width: 100%; }
  .cards { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .field-wide { grid-column: auto; }
}
.sub-tabs, .compare-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.sub-tab, .cmp-tab {
  border-radius: 999px;
  background: #eef2f7;
  color: var(--muted);
  font-size: 12px;
  padding: 5px 12px;
}
.sub-tab.active, .cmp-tab.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.field-section .toolbar { margin-top: 12px; }
.field-table table td input, .field-table table td select {
  width: 110px;
  padding: 4px 6px;
  font-size: 12px;
}
.compare-table { margin-top: 10px; }
.loadout-box {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.loadout-box .detail-actions { margin-top: 8px; }
.preset-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 12px;
}
.preset-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset-title { font-weight: 600; margin: 6px 0 2px; font-size: 12px; }
#panel-compare .cards { padding-top: 0; }
#cardTable .card-own, #cardTable .card-count { width: 90px; }
#playerValuesForm input, #resourceScalarForm input, #formationNamesForm input { width: 100%; }

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Pawns of War 存档工具</h1>
    <span class="sub">离线单文件 · 结构化编辑器 · POWSAVE1 / POWMIGR1</span>
  </div>
  <div class="top-actions">
    <select id="outMode" title="回包输出格式">
      <option value="auto">自动输出格式</option>
      <option value="save">POWSAVE1 普通存档</option>
      <option value="migration">POWMIGR1 迁移文件</option>
    </select>
    <button id="btnOpen" class="primary">打开存档</button>
    <button id="btnBackup" disabled>下载 .bak</button>
    <button id="btnRestore" disabled>恢复原始</button>
    <button id="btnUndo" disabled title="Ctrl+Z">撤销</button>
    <button id="btnRedo" disabled title="Ctrl+Y">重做</button>
    <button id="btnPack" class="primary" disabled>回包并下载</button>
    <button id="btnForcePack" class="danger" disabled hidden>强制回包</button>
  </div>
</header>
<input type="file" id="fileInput" accept="*/*" hidden>
<input type="file" id="compareFileInput" accept="*/*" hidden>
<input type="file" id="loadoutFileInput" accept=".json,application/json" hidden>
<div class="statusbar">
  <span id="status">请打开存档文件，或直接拖入窗口。</span>
  <span id="saveSafety" class="save-safety"></span>
  <span id="historyInfo" title="仅估算撤销/重做快照文本，不代表浏览器总内存"></span>
  <span id="stats"></span>
</div>
<nav class="tabs">
  <button class="tab-btn active" data-tab="overview">概览</button>
  <button class="tab-btn" data-tab="characters">角色</button>
  <button class="tab-btn" data-tab="weapons">武器</button>
  <button class="tab-btn" data-tab="modules">模块</button>
  <button class="tab-btn" data-tab="compare">对比</button>
  <button class="tab-btn" data-tab="fields">其他</button>
  <button class="tab-btn" data-tab="raw">原始 JSON</button>
</nav>
<main>
  <section id="panel-overview" class="panel active">
    <div class="cards">
      <div class="stat-card"><span class="stat-num" id="statChars">0</span><span class="stat-label">角色</span></div>
      <div class="stat-card"><span class="stat-num" id="statWeapons">0</span><span class="stat-label">武器</span></div>
      <div class="stat-card"><span class="stat-num" id="statModules">0</span><span class="stat-label">模块</span></div>
      <div class="stat-card"><span class="stat-num" id="statErrors">0</span><span class="stat-label">校验问题</span></div>
    </div>
    <div id="issues" class="issues"></div>
    <div class="editor-card">
      <div class="editor-head">
        <h2>玩家设置</h2>
        <span class="muted" id="overviewFile"></span>
      </div>
      <div id="overviewForm" class="form-grid"></div>
      <div class="detail-actions">
        <button data-action="apply-overview">应用设置</button>
      </div>
    </div>
  </section>

  <section id="panel-list" class="panel">
    <div class="list-head">
      <h2 id="listTitle">角色</h2>
      <span class="muted" id="listHint"></span>
    </div>
    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="搜索名称 / ID / 槽位">
      <select id="langSelect" title="名称语言">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="ko">한국어</option>
      </select>
      <select id="filterSelect" title="筛选"></select>
      <select id="batchAction" title="批量操作" hidden></select>
      <input id="batchInput" type="number" min="0" step="1" value="0" title="批量设置数量" hidden>
      <span class="page-info" id="pageInfo"></span>
      <button data-action="prev-page">上一页</button>
      <button data-action="next-page">下一页</button>
      <button data-action="copy-row">复制到空槽</button>
      <button data-action="reset-mods" id="btnResetMods" hidden>恢复默认配件</button>
      <button data-action="batch-set" id="btnBatchSet" hidden>执行批量操作</button>
      <button data-action="clear-row" class="danger">清空所选</button>
    </div>
    <div class="table-wrap">
      <table id="itemTable">
        <thead id="itemHead"></thead>
        <tbody id="itemBody"></tbody>
      </table>
    </div>
    <div id="detailPanel" class="detail-panel"></div>
  </section>

  <section id="panel-compare" class="panel">
    <div class="toolbar">
      <button id="btnLoadCompare">加载对比存档</button>
      <button id="btnClearCompare" disabled>清除对比</button>
      <span class="muted" id="compareName"></span>
    </div>
    <div class="cards">
      <div class="stat-card"><span class="stat-num" id="cmpChars">0</span><span class="stat-label">角色差异</span></div>
      <div class="stat-card"><span class="stat-num" id="cmpWeapons">0</span><span class="stat-label">武器差异</span></div>
      <div class="stat-card"><span class="stat-num" id="cmpModules">0</span><span class="stat-label">模块差异</span></div>
      <div class="stat-card"><span class="stat-num" id="cmpSettings">0</span><span class="stat-label">设置差异</span></div>
    </div>
    <div class="compare-tabs">
      <button class="cmp-tab active" data-cmp="characters">角色差异</button>
      <button class="cmp-tab" data-cmp="weapons">武器差异</button>
      <button class="cmp-tab" data-cmp="modules">模块差异</button>
    </div>
    <div class="table-wrap compare-table"><table id="compareTable"><thead></thead><tbody></tbody></table></div>
  </section>

  <section id="panel-fields" class="panel">
    <nav class="sub-tabs">
      <button class="sub-tab active" data-fieldtab="cards">卡牌</button>
      <button class="sub-tab" data-fieldtab="missions">任务/成就</button>
      <button class="sub-tab" data-fieldtab="resources">资源/商店</button>
      <button class="sub-tab" data-fieldtab="misc">编队/突袭</button>
    </nav>
    <div id="fields-cards" class="field-section">
      <div class="toolbar">
        <input id="cardSearch" type="search" placeholder="搜索卡牌名称 / ID">
        <button data-action="apply-cards">应用卡牌修改</button>
      </div>
      <div class="table-wrap field-table"><table id="cardTable"><thead><tr><th>ID</th><th>名称</th><th>拥有</th><th>使用次数</th></tr></thead><tbody></tbody></table></div>
    </div>
    <div id="fields-missions" class="field-section" hidden>
      <div class="toolbar">
        <select id="missionKey" title="数组字段"></select>
        <input id="missionSearch" type="search" placeholder="搜索编号 / 名称 / 数值">
        <input id="missionBatch" type="number" min="0" step="1" value="0" title="批量设置值">
        <button data-action="mission-batch">批量设置</button>
        <button data-action="apply-array">应用修改</button>
      </div>
      <div class="table-wrap field-table"><table id="missionTable"><thead><tr><th>编号</th><th>名称</th><th>值</th></tr></thead><tbody></tbody></table></div>
    </div>
    <div id="fields-resources" class="field-section" hidden>
      <div class="editor-card">
        <h2>玩家数值</h2>
        <div id="playerValuesForm" class="form-grid"></div>
        <div class="detail-actions"><button data-action="apply-player-values">应用数值</button></div>
      </div>
      <div class="editor-card">
        <h2>常用字段</h2>
        <div id="resourceScalarForm" class="form-grid"></div>
        <div class="detail-actions"><button data-action="apply-resource-scalars">应用字段</button></div>
      </div>
      <div class="editor-card">
        <h2>每日商店</h2>
        <div class="table-wrap field-table"><table id="shopTable"><thead><tr><th>槽</th><th>ID</th><th>已购买</th><th>最大购买</th><th>类型</th></tr></thead><tbody></tbody></table></div>
        <div class="detail-actions"><button data-action="apply-shop">应用商店</button></div>
      </div>
    </div>
    <div id="fields-misc" class="field-section" hidden>
      <div class="toolbar">
        <select id="miscKey" title="数组字段"></select>
        <input id="miscSearch" type="search" placeholder="搜索编号 / 数值">
        <button data-action="apply-array">应用修改</button>
      </div>
      <div class="table-wrap field-table"><table id="miscTable"><thead><tr><th>编号</th><th>值</th></tr></thead><tbody></tbody></table></div>
      <div class="editor-card">
        <h2>编队名称</h2>
        <div id="formationNamesForm" class="form-grid"></div>
        <div class="detail-actions"><button data-action="apply-formation-names">应用编队名称</button></div>
      </div>
    </div>
  </section>

  <section id="panel-raw" class="panel">
    <div class="toolbar">
      <button data-action="sync-raw">结构化 → JSON</button>
      <button data-action="parse-raw">JSON → 结构化</button>
      <button data-action="format-raw">格式化 JSON</button>
      <span class="muted">修改 JSON 后点击“JSON → 结构化”才会应用。</span>
    </div>
    <textarea id="rawArea" spellcheck="false"></textarea>
  </section>
</main>

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

function bytesToAscii(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return s;
}

function concatBytes() {
  let total = 0;
  for (let i = 0; i < arguments.length; i++) total += arguments[i].length;
  const out = new Uint8Array(total);
  let off = 0;
  for (let i = 0; i < arguments.length; i++) {
    out.set(arguments[i], off);
    off += arguments[i].length;
  }
  return out;
}

function equalBytes(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind === "ok" ? "ok" : (kind === "err" ? "err" : "");
}

function assertFileSize(file, maxBytes, label) {
  if (!file || !Number.isSafeInteger(file.size) || file.size < 0 || file.size > maxBytes) {
    throw new Error(`${label}超过大小上限 ${maxBytes / 1024 / 1024} MiB，未读取文件。`);
  }
}

function parseBoundedJson(text, maxChars = MAX_JSON_CHARS) {
  if (typeof text !== "string" || text.length > maxChars) {
    throw new Error(`JSON 文本超过 ${maxChars} 字符上限，未解析或替换当前内容。`);
  }
  return JSON.parse(text);
}

async function withFileOperation(action) {
  if (fileOperationBusy) throw new Error("正在读取或回包文件，请等待当前操作完成。");
  fileOperationBusy = true;
  try { return await action(); }
  finally { fileOperationBusy = false; }
}

async function readSaveJson(file) {
  assertFileSize(file, MAX_SAVE_FILE_BYTES, "存档文件");
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (bytes.byteLength > MAX_SAVE_FILE_BYTES) throw new Error("实际文件内容超过 8 MiB 上限。");
  const magic = bytesToAscii(bytes.slice(0, 8));
  const encrypted = magic === SAVE_MAGIC || magic === MIGRATION_MAGIC;
  const json = encrypted ? await decryptBytes(bytes) : new TextDecoder().decode(bytes);
  return { bytes, magic, encrypted, parsed: parseBoundedJson(json) };
}

async function importHmacKey(bytes) {
  return crypto.subtle.importKey("raw", bytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
}

async function hmacBytes(key, data) {
  return new Uint8Array(await crypto.subtle.sign("HMAC", key, data));
}

async function deriveKey(purpose) {
  const key = await importHmacKey(MASTER);
  return hmacBytes(key, new TextEncoder().encode(purpose));
}

async function aesDecrypt(ct, iv, keyBytes) {
  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, ct));
}

async function aesEncrypt(pt, iv, keyBytes) {
  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["encrypt"]);
  return new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv }, key, pt));
}

function downloadBytes(bytes, name) {
  const blob = new Blob([bytes], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1000);
}

async function decryptBytes(bytes) {
  if (bytes.byteLength > MAX_SAVE_FILE_BYTES) throw new Error("加密文件超过 8 MiB 上限，未解密。");
  const magic = bytesToAscii(bytes.slice(0, 8));
  const isMigration = magic === MIGRATION_MAGIC;
  if (magic !== SAVE_MAGIC && !isMigration) throw new Error("无法识别的魔数：" + magic);
  if (bytes.length < 62) throw new Error("文件太小，不是有效的加密存档。");

  const aesPurpose = isMigration ? "POW_MIGRATION_AES_KEY" : "POW_SAVE_AES_KEY";
  const hmacPurpose = isMigration ? "POW_MIGRATION_HMAC_KEY" : "POW_SAVE_HMAC_KEY";
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const payloadLen = dv.getUint32(10, true);
  if (payloadLen !== bytes.length - 62) throw new Error("头部长度与文件大小不匹配。");

  const iv = bytes.slice(14, 30);
  const ct = bytes.slice(30, 30 + payloadLen);
  const storedHmac = bytes.slice(bytes.length - 32);
  const aesKey = await deriveKey(aesPurpose);
  const hmacKey = await deriveKey(hmacPurpose);
  const computedHmac = await hmacBytes(await importHmacKey(hmacKey), bytes.slice(0, bytes.length - 32));
  if (!equalBytes(computedHmac, storedHmac)) throw new Error("HMAC 校验失败，文件可能损坏或被修改。");

  const plain = await aesDecrypt(ct, iv, aesKey);
  return new TextDecoder().decode(plain);
}

async function openFile(file) {
  return withFileOperation(() => openFileInternal(file));
}

async function openFileInternal(file) {
  const { bytes, magic, encrypted, parsed } = await readSaveJson(file);
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    throw new Error("存档 JSON 必须是对象。");
  }
  assertSaveValid(parsed);
  currentMode = magic === MIGRATION_MAGIC || isMigrationMetadata(parsed) ? "migration" : "save";
  originalBytes = encrypted ? bytes : null;
  root = parsed;
  originalJson = canonicalJson();
  currentFileName = file.name;
  clearHistory();
  page = 0;
  selected = { kind: "characters", slot: -1 };

  const v = validateSave(root);
  renderAll();
  setStatus(
    "已打开 " + file.name + "（" + file.size + " 字节）。" +
    (v.errors.length || v.warnings.length
      ? " 校验：" + v.errors.length + " 个错误，" + v.warnings.length + " 个警告。"
      : " 校验通过。"),
    v.errors.length ? "err" : "ok"
  );
}

async function verifyPackedBytes(bytes, expectedJson) {
  const roundTripJson = await decryptBytes(bytes);
  const parsed = parseBoundedJson(roundTripJson);
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    throw new Error("生成文件重新解密后不是有效的存档对象。");
  }
  if (roundTripJson !== expectedJson) {
    throw new Error("生成文件重新解密后的 JSON 与待保存内容不一致。");
  }
  return validateSave(parsed);
}

function confirmForcePack(validation) {
  const preview = validation.errors.slice(0, 10).map((s, i) => `${i + 1}. ${s}`).join("\n");
  const more = validation.errors.length > 10
    ? `\n……另有 ${validation.errors.length - 10} 个错误，完整列表见概览页。`
    : "";
  if (!window.confirm(
    `当前存档有 ${validation.errors.length} 个校验错误。强制回包可能导致游戏无法读取存档。\n\n` +
    preview + more + "\n\n仍要继续吗？"
  )) return false;
  return window.confirm("再次确认：强制回包只应用于你已了解风险的存档。确定继续生成文件吗？");
}

async function packSave(force) {
  try { return await withFileOperation(() => packSaveInternal(force)); }
  catch (e) { setStatus(e.message, "err"); }
}

async function packSaveInternal(force) {
  if (!root) return;
  const v = validateSave(root);
  if (v.errors.length) {
    if (!force) {
      renderIssues();
      updateToolbar();
      setStatus("存在 " + v.errors.length + " 个校验错误，正常回包已禁止。请先修复错误。", "err");
      return;
    }
    if (!confirmForcePack(v)) {
      setStatus("已取消强制回包。", "err");
      return;
    }
  }

  try {
    const json = canonicalJson();
    parseBoundedJson(json);
    const outMode = $("outMode").value;
    if (isMigrationMetadata(root) && outMode === "save") {
      throw new Error("迁移元数据不能作为普通游戏存档导出，请选择自动或迁移格式。");
    }
    const migration = outMode === "migration" || (outMode === "auto" && (currentMode === "migration" || isMigrationMetadata(root)));
    const magic = migration ? MIGRATION_MAGIC : SAVE_MAGIC;
    const aesPurpose = migration ? "POW_MIGRATION_AES_KEY" : "POW_SAVE_AES_KEY";
    const hmacPurpose = migration ? "POW_MIGRATION_HMAC_KEY" : "POW_SAVE_HMAC_KEY";

    const plain = new TextEncoder().encode(json);
    // 62-byte container overhead plus up to 16 bytes of CBC padding.
    if (plain.byteLength > MAX_SAVE_FILE_BYTES - 78) throw new Error("回包结果将超过 8 MiB 上限，未生成文件。");
    const iv = crypto.getRandomValues(new Uint8Array(16));
    const aesKey = await deriveKey(aesPurpose);
    const hmacKey = await deriveKey(hmacPurpose);
    const ct = await aesEncrypt(plain, iv, aesKey);

    const header = new Uint8Array(14);
    for (let i = 0; i < 8; i++) header[i] = magic.charCodeAt(i);
    header[8] = 1;
    header[9] = 0x10;
    new DataView(header.buffer).setUint32(10, ct.length, true);

    const body = concatBytes(header, iv, ct);
    const sig = await hmacBytes(await importHmacKey(hmacKey), body);
    const out = concatBytes(body, sig);
    const roundTripValidation = await verifyPackedBytes(out, json);
    if (!force && roundTripValidation.errors.length) {
      throw new Error("生成文件重新校验时发现 " + roundTripValidation.errors.length + " 个错误。");
    }

    const name = migration ? "render_cache.dat" : "save_file";
    downloadBytes(out, name);
    setStatus(
      (force ? "强制回包成功并已通过加密往返验证：" : "回包成功并已通过加密往返验证：") +
      name + "（" + out.length + " 字节）。" +
      (v.warnings.length ? " 警告：" + v.warnings.length + " 项。" : ""),
      force ? "err" : "ok"
    );
  } catch (e) {
    setStatus("回包失败，未下载文件：" + e.message, "err");
  }
}

function downloadBackup() {
  if (!originalBytes && !root) return;
  const base = (currentFileName || "save_file").replace(/\.(bak|dat|json)$/i, "");
  let bytes;
  let name;
  if (originalBytes) {
    bytes = originalBytes;
    name = base + ".bak";
  } else {
    bytes = new TextEncoder().encode(originalJson);
    name = base + ".bak.json";
  }
  downloadBytes(bytes, name);
  setStatus("已下载备份：" + name, "ok");
}

function restoreOriginal() {
  if (!root || !originalJson) return;
  if (!window.confirm("恢复为打开时的原始 JSON？当前未保存的修改会进入撤销栈。")) return;
  pushHistory("恢复原始");
  root = JSON.parse(originalJson);
  renderAll();
  setStatus("已恢复原始内容。", "ok");
}

function canonicalJson() {
  return JSON.stringify(root);
}

function clearHistory() {
  undoStack = [];
  redoStack = [];
  historyTrimmed = false;
  historySequence = 0;
}

function historyBytes() {
  return [...undoStack, ...redoStack].reduce((total, entry) => total + entry.bytes, 0);
}

function historyEntry(label) {
  const json = canonicalJson();
  const bytes = json.length * 2 + label.length * 2 + 64;
  if (json.length > MAX_JSON_CHARS || bytes > MAX_HISTORY_BYTES) {
    const message = "当前内容过大，无法建立撤销快照；此次修改未执行。请先导出备份。";
    setStatus(message, "err");
    throw new Error(message);
  }
  return { label, json, bytes, sequence: ++historySequence };
}

function trimHistory() {
  while (undoStack.length + redoStack.length > MAX_HISTORY || historyBytes() > MAX_HISTORY_BYTES) {
    const oldest = !redoStack.length || (undoStack.length && undoStack[0].sequence < redoStack[0].sequence)
      ? undoStack : redoStack;
    oldest.shift();
    historyTrimmed = true;
  }
}

function pushHistory(label) {
  if (!root) return;
  const entry = historyEntry(label || "编辑");
  redoStack = [];
  undoStack.push(entry);
  trimHistory();
  updateHistoryButtons();
}

function applyJson(json) {
  root = parseBoundedJson(json);
  selected = { kind: listKind, slot: -1 };
  page = 0;
  renderAll();
}

function undo() {
  if (!undoStack.length) return;
  const entry = historyEntry("撤销");
  const s = undoStack.pop();
  redoStack.push(entry);
  trimHistory();
  applyJson(s.json);
  setStatus("已撤销：" + s.label, "ok");
}

function redo() {
  if (!redoStack.length) return;
  const entry = historyEntry("重做");
  const s = redoStack.pop();
  undoStack.push(entry);
  trimHistory();
  applyJson(s.json);
  setStatus("已重做：" + s.label, "ok");
}

function getArr(key) {
  return getRenderArray(root, key);
}

function renderArrayLimit(key) {
  return Math.min(MAX_RENDER_ARRAY, SAVE_SCHEMA[key]?.length ?? SAVE_SCHEMA[key]?.maxLength ?? MAX_RENDER_ARRAY);
}

function getRenderArray(obj, key) {
  const arr = obj && Array.isArray(obj[key]) ? obj[key] : null;
  if (arr && arr.length > renderArrayLimit(key)) {
    setStatus(`${key} 长度 ${arr.length} 超过显示上限 ${renderArrayLimit(key)}，已停止显示；原始数据未截断。`, "err");
    return null;
  }
  return arr;
}

function showArrayRenderLimit(element, keys, columns = 0) {
  const oversized = keys.filter((key) => root && Array.isArray(root[key]) && root[key].length > renderArrayLimit(key));
  if (!oversized.length) return false;
  const message = oversized.join("、") + " 超过显示长度上限，已停止渲染；原始数据未截断，请撤销或重新打开有效存档。";
  element.innerHTML = columns
    ? `<tr><td class="empty" colspan="${columns}">${esc(message)}</td></tr>`
    : `<div class="detail-empty">${esc(message)}</div>`;
  setStatus(message, "err");
  return true;
}

function getVal(key, i) {
  const arr = getArr(key);
  return arr && i >= 0 && i < arr.length ? arr[i] : undefined;
}

function defaultValueFor(key) {
  if (SAVE_SCHEMA[key]?.type === "bool") return false;
  if (TEXT_KEYS.has(key)) return "";
  if (BOOL_KEYS.has(key)) return false;
  if (key === "ag_inv_hair_color") return { x: 0, y: 0, z: 0, w: 1 };
  return 0;
}

function defaultForArr(key, arr) {
  if (Array.isArray(arr) && arr.length) {
    const first = arr[0];
    if (typeof first === "string") return "";
    if (typeof first === "boolean") return false;
    if (first && typeof first === "object") return { x: 0, y: 0, z: 0, w: 1 };
  }
  return defaultValueFor(key);
}

function setArrVal(key, i, v, len) {
  const isNew = !Array.isArray(root[key]);
  const arr = isNew ? [] : root[key];
  const target = Math.max(i + 1, arr.length, isNew ? (SAVE_SCHEMA[key]?.length ?? len ?? 0) : 0);
  if (!Number.isSafeInteger(i) || i < 0 || !Number.isSafeInteger(target) || target > renderArrayLimit(key)) {
    const message = `${key} 下标或目标数组长度超限，未扩展数组。`;
    setStatus(message, "err");
    throw new Error(message);
  }
  if (isNew) root[key] = arr;
  while (arr.length < target) arr.push(defaultForArr(key, arr));
  arr[i] = v;
}

function nameOf(kind, id, lang) {
  if (!DATA) return "";
  const names = DATA.names && DATA.names[kind] && DATA.names[kind][lang];
  if (names && names[id]) return names[id];
  const prefix = DATA[kind] && DATA[kind].prefix && DATA[kind].prefix[id];
  return prefix && prefix !== "null" && prefix !== "" ? prefix : "";
}

function weaponInfo(id) {
  if (!DATA || !DATA.weapon) return null;
  return {
    prefix: DATA.weapon.prefix[id] || "",
    type: DATA.weapon.type[id] || "",
    damage: DATA.weapon.damage[id] || 0,
    cost: DATA.weapon.cost[id] || 0,
    defaultMods: DATA.weapon.defaultMods[id] || []
  };
}

function charInfo(id) {
  if (!DATA || !DATA.character) return null;
  return {
    prefix: DATA.character.prefix[id] || "",
    cls: DATA.character.class[id] || "",
    hp: DATA.character.hp[id] || 0,
    cost: DATA.character.cost[id] || 0
  };
}

function moduleInfo(id) {
  if (!DATA || !DATA.module) return null;
  return {
    prefix: DATA.module.prefix[id] || "",
    active: !!DATA.module.active[id]
  };
}

function rowId(kind, slot) {
  if (kind === "modules") return slot;
  const key = kind === "characters" ? "ag_inv_char_id" : "ag_inv_wpn_id";
  return getVal(key, slot) || 0;
}

function charNameAt(slot) {
  const id = getVal("ag_inv_char_id", slot);
  if (!id) return "-";
  return nameOf("character", id, currentLang) || "#" + id;
}

function weaponNameAt(slot) {
  const id = getVal("ag_inv_wpn_id", slot);
  if (!id) return "-";
  return nameOf("weapon", id, currentLang) || "#" + id;
}

function buildRows(kind) {
  const rows = [];
  const key = kind === "characters" ? "ag_inv_char_id" : kind === "weapons" ? "ag_inv_wpn_id" : "ag_inv_modul_count";
  if (root && Array.isArray(root[key]) && root[key].length > renderArrayLimit(key)) {
    getArr(key); // Report the refusal instead of silently showing a truncated inventory.
    return rows;
  }
  const arrLen = (getArr("ag_inv_char_id") || []).length || INVENTORY_LEN;
  const len = kind === "modules" && DATA && DATA.module
    ? Math.min(arrLen, DATA.module.prefix.length)
    : arrLen;
  for (let i = 0; i < len; i++) {
    if (kind === "characters") {
      const id = rowId(kind, i);
      const info = charInfo(id);
      rows.push({
        slot: i,
        id,
        name: nameOf("character", id, currentLang) || (info ? info.prefix : "") || "",
        internal: info ? info.prefix : "",
        cls: getVal("ag_inv_char_class", i) || (info ? info.cls : "") || "",
        lvl: getVal("ag_inv_char_lvl", i) || 0,
        exp: getVal("ag_inv_char_exp", i) || 0,
        hp: getVal("ag_inv_char_hp", i) || 0,
        firstWeapon: getVal("ag_inv_char_first_weapon", i) || 0,
        lock: !!getVal("ag_inv_char_lock", i)
      });
    } else if (kind === "weapons") {
      const id = rowId(kind, i);
      const info = weaponInfo(id);
      rows.push({
        slot: i,
        id,
        name: nameOf("weapon", id, currentLang) || (info ? info.prefix : "") || "",
        internal: info ? info.prefix : "",
        type: info ? info.type : "",
        damage: info ? info.damage : 0,
        cost: info ? info.cost : 0,
        lvl: getVal("ag_inv_wpn_lvl", i) || 0,
        exp: getVal("ag_inv_wpn_exp", i) || 0,
        toChar: getVal("ag_inv_wpn_to_char", i) || 0,
        lock: !!getVal("ag_inv_wpn_lock", i)
      });
    } else {
      const info = moduleInfo(i);
      rows.push({
        slot: i,
        id: i,
        name: nameOf("module", i, currentLang) || (info ? info.prefix : "") || "模块 " + i,
        internal: info ? info.prefix : "",
        active: info ? info.active : false,
        count: getVal("ag_inv_modul_count", i) || 0
      });
    }
  }
  return rows;
}

function matchesFilter(row) {
  const q = searchText.trim().toLowerCase();
  if (q) {
    const hay = [
      String(row.slot), String(row.id), String(row.name || ""),
      String(row.internal || ""), String(row.cls || ""), String(row.type || ""),
      String(row.count != null ? row.count : "")
    ].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (filter === "nonempty") return row.id !== 0 && row.id !== "";
  if (filter === "locked") return row.lock === true;
  if (filter === "unlocked") return row.lock === false;
  if (filter === "selectable") return row.active === true;
  if (filter === "hidden") return row.active === false;
  return true;
}

function charWeaponName(row) {
  if (!row.firstWeapon) return "-";
  const id = getVal("ag_inv_wpn_id", row.firstWeapon);

  return nameOf("weapon", id, currentLang) || "#" + id;

function renderListToolbar() {
  langSelect.value = currentLang;
  filterSelect.innerHTML = FILTERS[listKind].map(([v, label]) =>
    `<option value="${v}" ${v === filter ? "selected" : ""}>${label}</option>`
  ).join("");
  batchAction.innerHTML = BATCH_ACTIONS[listKind].map(([v, label]) =>
    `<option value="${v}">${label}</option>`
  ).join("");
  batchAction.hidden = false;
  $("listTitle").textContent = listKind === "characters" ? "角色" : listKind === "weapons" ? "武器" : "模块";
  btnResetMods.hidden = listKind !== "weapons";
  btnBatchSet.hidden = false;
  btnBatchSet.textContent = "执行批量操作";
  batchInput.hidden = batchAction.value === "clear";
  $("listHint").textContent = listKind === "characters" || listKind === "weapons"
    ? "选择行后可在下方编辑详情。"
    : "模块 ID 即数组下标；可选 / 隐藏 / 全部三种查看模式。";
}

function renderTable() {
  const head = $("itemHead");
  const body = $("itemBody");
  if (!root) {
    head.innerHTML = "";
    body.innerHTML = `<tr><td class="empty">请先打开存档。</td></tr>`;
    return;
  }
  const cols = TABLE_COLS[listKind];
  head.innerHTML = "<tr>" + cols.map((c) => `<th>${c.label}</th>`).join("") + "</tr>";
  if (showArrayRenderLimit(body, listKind === "characters" ? CHAR_COPY_KEYS
    : listKind === "weapons" ? WEAPON_COPY_KEYS : ["ag_inv_modul_count"], cols.length)) return;
  const all = buildRows(listKind).filter(matchesFilter);
  const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  if (page >= totalPages) page = totalPages - 1;
  const slice = all.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  body.innerHTML = slice.map((row) => {
    const sel = selected.kind === listKind && selected.slot === row.slot ? ' class="selected"' : "";
    return `<tr data-slot="${row.slot}"${sel}>` +
      cols.map((c) => `<td>${c.render(row)}</td>`).join("") +
      "</tr>";
  }).join("") || `<tr><td class="empty" colspan="${cols.length}">没有匹配的条目。</td></tr>`;
  const start = all.length ? page * PAGE_SIZE + 1 : 0;
  const end = Math.min(all.length, (page + 1) * PAGE_SIZE);
  $("pageInfo").textContent = start + "-" + end + " / " + all.length;
}

function inputHtml(f, val) {
  if (f.type === "bool") {
    return `<input type="checkbox" data-field="${f.key}" ${val ? "checked" : ""}>`;
  }
  if (f.type === "vec4") {
    const v = val && typeof val === "object" ? val : { x: 0, y: 0, z: 0, w: 1 };
    return `<span class="vec4">${["x", "y", "z", "w"].map((k) =>
      `<input type="number" step="any" data-field="${f.key}.${k}" value="${esc(v[k])}" title="${k}">`
    ).join("")}</span>`;
  }
  const step = f.type === "float" ? "any" : "1";
  const inputType = f.type === "text" ? "text" : "number";
  return `<input type="${inputType}" step="${step}" data-field="${f.key}" value="${esc(val)}">`;
}

function itemPickerLabel(kind, id, allowZero) {
  if (allowZero && id === 0) return "0 - 空";
  return `${id} - ${nameOf(kind, id, currentLang) || "未命名"}`;
}

function itemPickerHtml(kind, id, listId, attributes, allowZero, itemType) {
  const items = DATA && DATA[kind] && DATA[kind].prefix ? DATA[kind].prefix : [];
  if (items.length > MAX_RENDER_ARRAY) {
    return `<span>物品字典超过 ${MAX_RENDER_ARRAY} 项显示上限，已停止生成选项。</span>`;
  }
  const options = [];
  if (allowZero) options.push(`<option value="0 - 空"></option>`);
  for (let itemId = 1; itemId < items.length; itemId++) {
    if (itemType && DATA[kind].type?.[itemId] !== itemType) continue;
    options.push(`<option value="${esc(itemPickerLabel(kind, itemId, false))}"></option>`);
  }
  const valid = (allowZero && id === 0) || (id >= 1 && id < items.length);
  const value = valid ? itemPickerLabel(kind, id, allowZero) : String(id);
  return `<input ${attributes} type="text" list="${listId}" value="${esc(value)}" autocomplete="off">` +
    `<datalist id="${listId}">${options.join("")}</datalist>`;
}

function parseItemPicker(input, kind, allowZero, itemType) {
  const value = input.value.trim();
  if (allowZero && (value === "0" || value === "0 - 空")) return 0;
  if (!/^\d+$/.test(value) && !/^\d+\s+-\s+.+$/.test(value)) return null;
  const id = Number(value.match(/^\d+/)[0]);
  const items = DATA && DATA[kind] && DATA[kind].prefix ? DATA[kind].prefix : [];
  if (!Number.isInteger(id) || id < 1 || id >= items.length) return null;
  if (itemType && DATA[kind].type?.[id] !== itemType) return null;
  return value === String(id) || value === itemPickerLabel(kind, id, false) ? id : null;
}

function renderDetail() {
  const el = $("detailPanel");
  if (!root || selected.slot < 0 || !["characters", "weapons", "modules"].includes(selected.kind)) {
    el.innerHTML = `<div class="detail-empty">请先选择一个条目。</div>`;
    return;
  }
  const kind = listKind;
  const slot = selected.slot;
  const row = buildRows(kind).find((r) => r.slot === slot);
  if (!row) {
    el.innerHTML = `<div class="detail-empty">该槽位超出数组范围。</div>`;
    return;
  }

  let html = `<div class="detail-head"><h3>${esc(row.name || "空")}<span class="slot-tag">槽位 ${slot}</span></h3>`;
  if (kind === "weapons") html += `<button type="button" class="mini" data-action="reset-mods">恢复默认配件</button>`;
  html += `</div><form id="detailForm" class="form-grid">`;

  for (const f of KIND_FIELDS[kind]) {
    let val;
    if (kind === "modules") {
      val = getVal("ag_inv_modul_count", slot) || 0;
    } else {
      val = getVal(f.key, slot);
    }
    const input = f.picker
      ? itemPickerHtml(f.picker, val ?? 0, `cloth-picker-${f.itemType}`, `data-field="${f.key}"`, true, f.itemType)
      : inputHtml(f, val);
    html += `<label class="field${f.type === "vec4" || f.picker ? " field-wide" : ""}"><span>${f.label}</span>${input}</label>`;
  }

  if (kind === "characters") {
    html += `<div class="muted field-wide">穿着槽支持按 ID / 名称搜索，也可直接填写 ID；选择“0 - 空”卸下。候选按槽位分类，无本地化名称时显示内部名称。点击“应用修改”后生效。</div>`;
  }

  if (kind === "weapons") {
    for (let n = 1; n <= 13; n++) {
      const modId = getVal("ag_inv_wpn_mod_" + n, slot) || 0;
      html += `<label class="field field-wide"><span>配件槽 ${n}</span>` +
        itemPickerHtml("module", modId, `module-picker-${n}`, `data-mod="${n}"`, true) + `</label>`;
    }
  }

  html += `</form><div class="detail-actions"><button data-action="apply-detail">应用修改</button>` +
    `<button data-action="reset-detail-form">重置表单</button></div>`;
  if (kind === "weapons") {
    html += `<div class="loadout-box"><div class="detail-actions">` +
      `<button data-action="save-loadout">保存预设</button>` +
      `<button data-action="export-loadout">导出文件</button>` +
      `<button data-action="import-loadout">导入文件</button>` +
      `</div><div id="loadoutPresets"></div></div>`;
  }
  el.innerHTML = html;
  if (kind === "weapons") renderLoadoutPresets();
}

function renderOverview() {
  const form = $("overviewForm");
  if (!root) {
    form.innerHTML = "";
    $("overviewFile").textContent = "";
    return;
  }
  form.innerHTML = OVERVIEW_FIELDS.map((f) => {
    const val = root[f.key];
    return `<label class="field"><span>${f.label}</span>${inputHtml(f, val)}</label>`;
  }).join("");
  $("overviewFile").textContent = currentFileName ? "已打开：" + currentFileName : "";
}

function updateStats() {
  if (!root) {
    $("statChars").textContent = "0";
    $("statWeapons").textContent = "0";
    $("statModules").textContent = "0";
    $("statErrors").textContent = "0";
    statsEl.textContent = "";
    return;
  }
  const chars = (getArr("ag_inv_char_id") || []).filter((v) => v).length;
  const weapons = (getArr("ag_inv_wpn_id") || []).filter((v) => v).length;
  const modules = (getArr("ag_inv_modul_count") || []).filter((v) => v > 0).length;
  const v = validateSave(root);
  $("statChars").textContent = chars;
  $("statWeapons").textContent = weapons;
  $("statModules").textContent = modules;
  $("statErrors").textContent = v.errors.length + v.warnings.length;
  statsEl.textContent = "角色 " + chars + " · 武器 " + weapons + " · 模块 " + modules;
}

function renderIssues() {
  const el = $("issues");
  if (!root) {
    el.innerHTML = "";
    return;
  }
  const v = validateSave(root);
  const items = [
    ...v.errors.map((s) => ({ s, cls: "err" })),
    ...v.warnings.map((s) => ({ s, cls: "warn" }))
  ];
  el.innerHTML = items.length
    ? `<h3>校验结果（${v.errors.length} 错误 / ${v.warnings.length} 警告）</h3><ul>` +
      items.slice(0, MAX_VISIBLE_ISSUES).map((i) => `<li class="${i.cls}">${esc(i.s)}</li>`).join("") + "</ul>" +
      (items.length > MAX_VISIBLE_ISSUES ? `<p>仅显示前 ${MAX_VISIBLE_ISSUES} 项，共 ${items.length} 项；修复后重新校验。</p>` : "")
    : `<div class="ok-line">校验通过，未发现结构问题。</div>`;
}

function updateHistoryButtons() {
  btnUndo.disabled = !undoStack.length;
  btnRedo.disabled = !redoStack.length;
  $("historyInfo").textContent = root
    ? `历史 ${undoStack.length + redoStack.length}/${MAX_HISTORY} 条 · ${(historyBytes() / 1024 / 1024).toFixed(1)}/16 MiB` +
      (historyTrimmed ? "（已释放较早记录）" : "")
    : "";
}

function updateToolbar() {
  const has = !!root;
  const v = has ? validateSave(root) : { errors: [], warnings: [] };
  btnBackup.disabled = !has;
  btnRestore.disabled = !has;
  btnPack.disabled = !has || v.errors.length > 0;
  btnPack.title = v.errors.length
    ? "存在校验错误，修复后才能正常回包"
    : "回包并下载";
  btnForcePack.hidden = !has || v.errors.length === 0;
  btnForcePack.disabled = !has || v.errors.length === 0;
  saveSafetyEl.textContent = !has
    ? ""
    : v.errors.length
      ? `禁止正常回包：${v.errors.length} 个错误`
      : v.warnings.length
        ? `可回包：${v.warnings.length} 个警告`
        : "已通过现有校验，可回包";
  saveSafetyEl.className = "save-safety " + (v.errors.length ? "err" : "ok");
  updateHistoryButtons();
}

function renderAll() {
  updateStats();
  renderIssues();
  if (activeTab === "overview") {
    renderOverview();
  } else if (activeTab === "raw") {
    $("rawArea").value = root ? canonicalJson() : "";
  } else if (activeTab === "compare") {
    renderCompare();
  } else if (activeTab === "fields") {
    renderFieldTab();
  } else {
    renderListToolbar();
    renderTable();
    renderDetail();
  }
  updateToolbar();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b) =>
    b.classList.toggle("active", b.dataset.tab === tab)
  );
  $("panel-overview").classList.toggle("active", tab === "overview");
  $("panel-list").classList.toggle("active", ["characters", "weapons", "modules"].includes(tab));
  $("panel-compare").classList.toggle("active", tab === "compare");
  $("panel-fields").classList.toggle("active", tab === "fields");
  $("panel-raw").classList.toggle("active", tab === "raw");

  if (["characters", "weapons", "modules"].includes(tab)) {
    listKind = tab;
    filter = DEFAULT_FILTER[tab];
    page = 0;
    selected = { kind: tab, slot: -1 };
    renderListToolbar();
    renderTable();
    renderDetail();
  } else if (tab === "raw") {
    $("rawArea").value = root ? canonicalJson() : "";
  } else if (tab === "compare") {
    renderCompare();
  } else if (tab === "fields") {
    renderFieldTab();
  } else {
    renderOverview();
  }
}

// Known fields follow the bundled editor definitions and the local 1035 save fixtures.
// Unknown/version-specific fields are preserved, bounded, and reported, not guessed.
const SAVE_SCHEMA = (() => {
  const schema = Object.create(null);
  const add = (keys, rule) => {
    for (const key of keys.split(/\s+/)) schema[key] = { ...rule };
  };
  for (const f of [...CHAR_FIELDS, ...WEAPON_FIELDS]) {
    schema[f.key] = { type: f.type, length: INVENTORY_LEN };
  }
  for (const f of [...OVERVIEW_FIELDS, ...RESOURCE_SCALAR_FIELDS]) {
    schema[f.key] = { type: f.type };
  }
  add("ag_crypto ag_player_f5 ag_alternative_path_save ag_player_have_news ag_inv_char_sort_increase ag_inv_wpn_sort_increase ag_battle_skip_conf_actions", { type: "bool" });
  add("ag_inv_char_filter_class ag_inv_char_filter_rarity ag_inv_wpn_filter_class ag_inv_wpn_filter_rarity gen_path_name gen_path_desc", { type: "text" });
  add("ag_sel_preset ag_inv_char_filter_formation ag_inv_char_filter_lvlup ag_inv_char_sort_id ag_inv_wpn_filter_equipped ag_inv_wpn_filter_lvlup ag_inv_wpn_sort_id ag_player_daily_raid gen_path_counts ag_event_shop_count_itms", { type: "int" });
  add("ag_inv_modul_count ag_inv_card_own ag_inv_card_card_count_use ag_player_compl_missions ag_player_achive ag_drop_count_modul ag_raid_reload_maps", { type: "int", min: 0, length: 1000 });
  add("ag_dialog_show ag_player_can_getgift ag_player_getgift ag_player_redemn_code", { type: "bool", length: 1000 });
  add("ag_player_open_campaigns", { type: "bool", length: 200 });
  add("ag_drop_count_char ag_drop_count_wpn", { type: "int", min: 0, length: 500 });
  add("ag_player_lbx_count ag_player_lbx_pity_gold ag_player_lbx_pity_orange", { type: "int", min: 0, length: 100 });
  add("ag_player_daily_shop_id ag_player_daily_shop_buy ag_player_daily_shop_buy_max ag_player_daily_shop_type ag_event_shop_player_buy", { type: "int", min: 0, length: 50 });
  add("ag_formation_live2d", { type: "int", min: 0, length: 100 });
  add("ag_formation_preset_name", { type: "text", length: 20 });
  add("ag_formation_preset_num", { type: "formation", length: 20 });
  add("ag_player_values", { type: "int", minLength: 1, maxLength: 1000 });
  add("gen_path_type gen_path_difficault gen_path_ico gen_path_reward gen_path_map gen_path_time gen_path_reward_multiplex", { type: "int", length: 1000 });
  add("gen_path_pos_x gen_path_pos_y", { type: "float", length: 1000 });
  for (let n = 1; n <= 13; n++) {
    schema["ag_inv_wpn_mod_" + n] = { type: "int", min: 0, table: "module", length: 1000 };
  }
  for (const key of ["ag_inv_char_id", "ag_inv_wpn_id"]) {
    Object.assign(schema[key], { min: 0, table: key === "ag_inv_char_id" ? "character" : "weapon" });
  }
  for (const f of CHAR_FIELDS.filter((field) => field.picker)) {
    Object.assign(schema[f.key], { min: 0, table: f.picker });
  }
  for (const key of ["ag_inv_char_first_weapon", "ag_inv_wpn_to_char"]) {
    Object.assign(schema[key], { min: 0, max: INVENTORY_LEN - 1 });
  }
  for (const key of ["ag_inv_char_lvl", "ag_inv_char_exp", "ag_inv_char_need_exp", "ag_inv_char_kills", "ag_inv_wpn_lvl", "ag_inv_wpn_exp", "ag_inv_wpn_need_exp", "ag_user_lvl"]) {
    schema[key].min = 0;
  }
  for (const key of ["ag_vol_music", "ag_vol_sfx", "ag_vol_ui"]) {
    Object.assign(schema[key], { min: 0, max: 1 });
  }
  schema.ag_player_daily_shop_type.max = 2;
  schema.ag_player_daily_shop_reload = { type: "int" };
  schema.formatVersion = { type: "int", min: 1 };
  schema.migrationCount = { type: "int", min: 0 };
  return schema;
})();

function isMigrationMetadata(obj) {
  return obj && typeof obj === "object" && !Array.isArray(obj) &&
    (Object.hasOwn(obj, "formatVersion") || Object.hasOwn(obj, "migrationCount")) &&
    !Object.keys(obj).some((k) => k.startsWith("ag_") || k.startsWith("gen_path_"));
}

function validateSaveSchema(obj, errors, warnings) {
  const maxErrors = 100;
  const fail = (path, reason) => {
    if (errors.length < maxErrors) errors.push(path + ": " + reason);
  };
  const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const checkValue = (v, rule, path) => {
    if (errors.length >= maxErrors) return;
    if (rule.type === "text") {
      if (typeof v !== "string" || v.length > 4096) fail(path, "必须是长度不超过 4096 的字符串。");
    } else if (rule.type === "bool") {
      if (typeof v !== "boolean") fail(path, "必须是布尔值 true/false，不能用 0/1 或字符串代替。");
    } else if (rule.type === "vec4") {
      if (!isObject(v)) return fail(path, "必须是含 x/y/z/w 的颜色对象。");
      for (const k of ["x", "y", "z", "w"]) checkValue(v[k], { type: "float", min: 0, max: 1 }, path + "." + k);
    } else if (rule.type === "formation") {
      if (!isObject(v)) return fail(path, "必须是编队对象，不能替换成一个数字。");
      checkValue(v.ag_formation_preset_active, { type: "bool" }, path + ".ag_formation_preset_active");
      for (const k of ["ag_formation_preset_unit_id", "ag_formation_preset_unit_cost", "ag_formation_preset_unit_hp"]) {
        const nested = { type: "int", length: 100 };
        if (k.endsWith("_id")) Object.assign(nested, { min: 0, max: INVENTORY_LEN - 1 });
        checkArray(v[k], nested, path + "." + k);
      }
    } else {
      const valid = rule.type === "int" ? Number.isSafeInteger(v)
        : typeof v === "number" && Number.isFinite(v) && Math.abs(v) <= Number.MAX_SAFE_INTEGER;
      if (!valid) return fail(path, rule.type === "int" ? "必须是安全整数，不能是字符串、小数或超大数值。" : "必须是有限且精度范围安全的数字。");
      let max = rule.max ?? Number.MAX_SAFE_INTEGER;
      if (rule.table && DATA && DATA[rule.table]) max = DATA[rule.table].prefix.length - 1;
      const min = rule.min ?? -Number.MAX_SAFE_INTEGER;
      if (v < min || v > max) fail(path, `数值必须在 ${min}..${max} 范围内。`);
    }
  };
  const checkArray = (arr, rule, path) => {
    if (!Array.isArray(arr)) return fail(path, "必须是数组。");
    const min = rule.length ?? rule.minLength;
    const max = rule.length ?? rule.maxLength;
    if (arr.length < min || arr.length > max) {
      return fail(path, rule.length !== undefined
        ? `数组长度必须是 ${rule.length}，实际为 ${arr.length}。`
        : `数组长度必须在 ${min}..${max} 范围内。`);
    }
    for (let i = 0; i < arr.length && errors.length < maxErrors; i++) checkValue(arr[i], rule, `${path}[${i}]`);
  };
  const required = isMigrationMetadata(obj) ? ["formatVersion", "migrationCount"]
    : ["ag_inv_char_id", "ag_inv_wpn_id", "ag_inv_modul_count"];
  for (const key of required) {
    if (!Object.hasOwn(obj, key)) fail(key, "缺少必需字段。");
  }
  for (const [key, rule] of Object.entries(SAVE_SCHEMA)) {
    if (!Object.hasOwn(obj, key)) continue; // Optional/version-specific fields are not synthesized.
    if (rule.length !== undefined || rule.maxLength !== undefined) checkArray(obj[key], rule, key);
    else checkValue(obj[key], rule, key);
  }
  // Bound every field, including unknown extensions, without interpreting their semantics.
  let nodes = 0;
  const walk = (v, path, depth) => {
    if (errors.length >= maxErrors) return;
    if (++nodes > 200000) return;
    if (depth > 32) return fail(path, "嵌套超过 32 层。");
    if (typeof v === "number" && (!Number.isFinite(v) || Math.abs(v) > Number.MAX_SAFE_INTEGER)) fail(path, "数字超出安全范围。");
    if (typeof v === "string" && v.length > 4096) fail(path, "文本超过 4096 个字符。");
    if (Array.isArray(v)) {
      if (v.length > 10000) return fail(path, "数组超过安全上限 10000。");
      for (let i = 0; i < v.length && nodes <= 200000 && errors.length < maxErrors; i++) walk(v[i], `${path}[${i}]`, depth + 1);
    } else if (isObject(v)) {
      for (const k of Object.keys(v)) {
        if (nodes > 200000 || errors.length >= maxErrors) break;
        walk(v[k], path + "." + k, depth + 1);
      }
    }
  };
  walk(obj, "存档", 0);
  if (nodes > 200000) fail("存档", "字段/元素总数超过安全上限 200000。");
  const unknown = Object.keys(obj).filter((k) => !Object.hasOwn(SAVE_SCHEMA, k));
  if (unknown.length) warnings.push(`保留 ${unknown.length} 个未知字段：仅检查通用结构上限，未验证游戏含义。`);
  if (!DATA) warnings.push("未加载数据字典，无法验证角色、武器和配件的 ID 上限。");
  if (errors.length === maxErrors) warnings.push("错误过多，仅显示前 100 项；修复后重新校验。");
}

function assertSaveValid(obj) {
  const v = validateSave(obj);
  if (v.errors.length) throw new Error("存档校验失败，原有内容未替换：\n" + v.errors.slice(0, 5).join("\n") +
    (v.errors.length > 5 ? `\n另有 ${v.errors.length - 5} 项错误。` : ""));
  return v;
}

function validateSave(rootObj) {
  const errors = [];
  const warnings = [];
  if (!rootObj || typeof rootObj !== "object" || Array.isArray(rootObj)) {
    errors.push("存档不是 JSON 对象。");
    return { errors, warnings };
  }

  validateSaveSchema(rootObj, errors, warnings);
  if (errors.length) return { errors, warnings };
  if (isMigrationMetadata(rootObj)) return { errors, warnings };

  const shopIds = rootObj.ag_player_daily_shop_id;
  const shopTypes = rootObj.ag_player_daily_shop_type;
  if (Array.isArray(shopIds) && Array.isArray(shopTypes)) {
    for (let i = 0; i < shopIds.length; i++) {
      const type = shopTypes[i];
      const id = shopIds[i];
      const kind = type === 1 ? "character" : type === 2 ? "weapon" : null;
      if ((type === 0 && id !== 0) || (kind && (id < 1 || (DATA?.[kind] && id >= DATA[kind].prefix.length)))) {
        errors.push(`ag_player_daily_shop_id[${i}]: 物品 ID 与商品类型不匹配或超出数据表范围。`);
      }
    }
  }

  const required = ["ag_inv_char_id", "ag_inv_wpn_id", "ag_inv_modul_count"];
  for (const k of required) {
    if (!Array.isArray(rootObj[k])) errors.push("缺少数组 " + k);
  }
  if (errors.length) return { errors, warnings };

  const baseLen = rootObj.ag_inv_char_id.length;
  for (const k of required) {
    if (rootObj[k].length !== baseLen) {
      warnings.push(k + " 长度为 " + rootObj[k].length + "，与角色数组长度 " + baseLen + " 不一致。");
    }
  }
  if (baseLen !== INVENTORY_LEN) {
    warnings.push("存档数组长度为 " + baseLen + "，常见版本为 " + INVENTORY_LEN + "。");
  }

  if (DATA) {
    const wMax = DATA.weapon.prefix.length - 1;
    const cMax = DATA.character.prefix.length - 1;
    const mMax = DATA.module.prefix.length - 1;
    rootObj.ag_inv_wpn_id.forEach((v, i) => {
      if (typeof v === "number" && v > wMax) {
        errors.push("武器槽 " + i + ": ID " + v + " 超出数据表范围 0.." + wMax + "。");
      }
    });
    rootObj.ag_inv_char_id.forEach((v, i) => {
      if (typeof v === "number" && v > cMax) {
        errors.push("角色槽 " + i + ": ID " + v + " 超出数据表范围 0.." + cMax + "。");
      }
    });
    rootObj.ag_inv_modul_count.forEach((v, i) => {
      if (typeof v === "number" && v < 0) {
        errors.push("模块 " + i + ": 数量不能为负数。");
      }
    });
    for (let n = 1; n <= 13; n++) {
      const arr = rootObj["ag_inv_wpn_mod_" + n];
      if (!Array.isArray(arr)) continue;
      arr.forEach((v, i) => {
        if (typeof v === "number" && (v < 0 || v > mMax)) {
          errors.push("武器槽 " + i + " 配件槽 " + n + ": ID " + v + " 超出范围 0.." + mMax + "。");
        }
      });
    }
  }

  const charLen = rootObj.ag_inv_char_id.length;
  const wpnLen = rootObj.ag_inv_wpn_id.length;
  if (Array.isArray(rootObj.ag_inv_wpn_to_char)) {
    rootObj.ag_inv_wpn_to_char.forEach((to, i) => {
      if (to && (to < 0 || to >= charLen)) {
        errors.push("武器槽 " + i + ": 装备角色槽 " + to + " 超出范围 0.." + (charLen - 1) + "。");
      }
    });
  }
  if (Array.isArray(rootObj.ag_inv_char_first_weapon)) {
    rootObj.ag_inv_char_first_weapon.forEach((fw, i) => {
      if (fw && (fw < 0 || fw >= wpnLen)) {
        errors.push("角色槽 " + i + ": 主武器槽 " + fw + " 超出范围 0.." + (wpnLen - 1) + "。");
      }
    });
  }
  if (Array.isArray(rootObj.ag_inv_wpn_to_char) && Array.isArray(rootObj.ag_inv_char_first_weapon)) {
    rootObj.ag_inv_wpn_to_char.forEach((to, i) => {
      if (to && rootObj.ag_inv_char_first_weapon[to] !== i) {
        warnings.push("武器槽 " + i + " 装备到角色槽 " + to + "，但该角色主武器不是 " + i + "。");
      }
    });
    rootObj.ag_inv_char_first_weapon.forEach((fw, i) => {
      if (fw && rootObj.ag_inv_wpn_to_char[fw] !== i) {
        warnings.push("角色槽 " + i + " 主武器为 " + fw + "，但该武器未装备到角色 " + i + "。");
      }
    });
  }
  return { errors, warnings };
}

function findEmptySlot(kind) {
  const key = kind === "characters" ? "ag_inv_char_id" : "ag_inv_wpn_id";
  const arr = getArr(key) || [];
  for (let i = 0; i < arr.length; i++) if (!arr[i]) return i;
  return -1;
}

function copyRow() {
  if (!root || selected.slot < 0 || listKind === "modules") return;
  const src = selected.slot;
  const id = rowId(listKind, src);
  if (!id) {
    setStatus("所选槽位为空，无法复制。", "err");
    return;
  }
  const dst = findEmptySlot(listKind);
  if (dst < 0) {
    setStatus("没有空槽位可用于复制。", "err");
    return;
  }
  if (!window.confirm("将 " + (listKind === "characters" ? "角色" : "武器") + " 槽 " + src + " 复制到空槽 " + dst + "？")) return;

  pushHistory("复制槽位 " + src + " 到 " + dst);
  const keys = listKind === "characters" ? CHAR_COPY_KEYS : WEAPON_COPY_KEYS;
  for (const key of keys) {
    const arr = root[key];
    if (!Array.isArray(arr) || src >= arr.length) continue;
    setArrVal(key, dst, arr[src], Math.max(arr.length, INVENTORY_LEN));
  }
  if (listKind === "weapons") setArrVal("ag_inv_wpn_to_char", dst, 0, INVENTORY_LEN);
  if (listKind === "characters") setArrVal("ag_inv_char_first_weapon", dst, 0, INVENTORY_LEN);
  selected = { kind: listKind, slot: dst };
  renderAll();
  setStatus("已复制到槽位 " + dst + "。", "ok");
}

function clearRow() {
  if (!root || selected.slot < 0) return;
  const slot = selected.slot;
  const label = listKind === "characters" ? "角色" : listKind === "weapons" ? "武器" : "模块";
  if (!window.confirm("确定清空" + label + "槽 " + slot + "？该操作可撤销。")) return;
  pushHistory("清空" + label + "槽 " + slot);
  clearSlotValues(listKind, slot);
  renderAll();
  setStatus("已清空" + label + "槽 " + slot + "。", "ok");
}

function clearSlotValues(kind, slot) {
  if (kind === "modules") {
    setArrVal("ag_inv_modul_count", slot, 0, INVENTORY_LEN);
    return;
  }
  const keys = kind === "characters" ? CHAR_COPY_KEYS : WEAPON_COPY_KEYS;
  for (const key of keys) {
    const arr = root[key];
    if (!Array.isArray(arr) || slot >= arr.length) continue;
    arr[slot] = defaultForArr(key, arr);
  }
  if (kind === "characters" && Array.isArray(root.ag_inv_wpn_to_char)) {
    root.ag_inv_wpn_to_char.forEach((to, i) => {
      if (to === slot) root.ag_inv_wpn_to_char[i] = 0;
    });
  }
  if (kind === "weapons" && Array.isArray(root.ag_inv_char_first_weapon)) {
    root.ag_inv_char_first_weapon.forEach((fw, i) => {
      if (fw === slot) root.ag_inv_char_first_weapon[i] = 0;
    });
  }
}

function resetMods() {
  if (!root || listKind !== "weapons" || selected.slot < 0) return;
  const id = rowId("weapons", selected.slot);
  const info = weaponInfo(id);
  const defaults = info && info.defaultMods ? info.defaultMods : new Array(13).fill(0);
  if (!defaults.length) {
    setStatus("数据字典中缺少该武器的默认配件。", "err");
    return;
  }
  pushHistory("恢复武器默认配件 " + selected.slot);
  for (let n = 1; n <= 13; n++) {
    setArrVal("ag_inv_wpn_mod_" + n, selected.slot, defaults[n - 1] || 0, INVENTORY_LEN);
  }
  renderAll();
  setStatus("已恢复武器槽 " + selected.slot + " 的默认配件。", "ok");
}

function loadPresets() {
  try {
    const raw = localStorage.getItem(PRESET_KEY);
    const arr = raw ? parseBoundedJson(raw, MAX_PRESET_LIBRARY_CHARS) : [];
    if (!Array.isArray(arr) || arr.length > MAX_PRESETS || !arr.every(validatePreset)) {
      throw new Error(`预设库格式无效或超过 ${MAX_PRESETS} 条上限。`);
    }
    return arr;
  } catch (e) {
    throw new Error("预设库无法加载，原数据保留且不会被覆盖：" + e.message);
  }
}

function savePresets(list) {
  if (!Array.isArray(list) || list.length > MAX_PRESETS || !list.every(validatePreset)) {
    throw new Error(`预设库格式无效或超过 ${MAX_PRESETS} 条上限，未保存。`);
  }
  const json = JSON.stringify(list);
  if (json.length > MAX_PRESET_LIBRARY_CHARS) throw new Error("预设库超过约 1 MiB 文本内存上限，原数据未改动。");
  localStorage.setItem(PRESET_KEY, json);
}

function validatePreset(p) {
  return p && typeof p === "object" &&
    Array.isArray(p.mods) && p.mods.length === 13 &&
    p.mods.every((v) => Number.isSafeInteger(v) && v >= 0 &&
      (!DATA || !DATA.module || v < DATA.module.prefix.length)) &&
    [p.name, p.weaponName].every((v) => v === undefined || (typeof v === "string" && v.length <= 4096));
}

function currentLoadout() {
  const mods = [];
  for (let n = 1; n <= 13; n++) mods.push(getVal("ag_inv_wpn_mod_" + n, selected.slot) || 0);
  return {
    type: "weapon-loadout",
    version: 1,
    weaponId: rowId("weapons", selected.slot),
    weaponName: nameOf("weapon", rowId("weapons", selected.slot), currentLang) || "",
    mods
  };
}

function renderLoadoutPresets() {
  const el = $("loadoutPresets");
  if (!el) return;
  let presets;
  try { presets = loadPresets(); }
  catch (e) { el.textContent = e.message; setStatus(e.message, "err"); return; }
  el.innerHTML = presets.length
    ? `<div class="preset-title">预设库</div>` + presets.map((p, i) =>
        `<div class="preset-row"><span>${esc(p.name || p.weaponName || "预设 " + (i + 1))}</span>` +
        `<button class="mini" data-action="use-preset" data-index="${i}">应用</button>` +
        `<button class="mini danger" data-action="delete-preset" data-index="${i}">删除</button></div>`
      ).join("")
    : `<div class="muted">暂无预设，可先保存当前武器配件。</div>`;
}

function saveLoadout() {
  if (!root || listKind !== "weapons" || selected.slot < 0) return;
  const preset = currentLoadout();
  const name = window.prompt("预设名称：", preset.weaponName || "武器 " + selected.slot);
  if (name === null) return;
  preset.name = name.trim() || ("武器 " + selected.slot);
  try {
    const list = loadPresets();
    list.push(preset);
    savePresets(list);
  } catch (e) { setStatus("保存预设失败：" + e.message, "err"); return; }
  renderLoadoutPresets();
  setStatus("已保存预设：" + preset.name, "ok");
}

function usePreset(index) {
  if (!root || listKind !== "weapons" || selected.slot < 0) return;
  let presets;
  try { presets = loadPresets(); }
  catch (e) { setStatus(e.message, "err"); return; }
  const p = presets[index];
  if (!p || !validatePreset(p)) {
    setStatus("预设数据无效。", "err");
    return;
  }
  pushHistory("应用预设 " + (p.name || index));
  for (let n = 1; n <= 13; n++) {
    setArrVal("ag_inv_wpn_mod_" + n, selected.slot, p.mods[n - 1] || 0, INVENTORY_LEN);
  }
  renderAll();
  setStatus("已应用预设到武器槽 " + selected.slot + "。", "ok");
}

function deletePreset(index) {
  let presets;
  try { presets = loadPresets(); }
  catch (e) { setStatus(e.message, "err"); return; }
  const p = presets[index];
  if (!p) return;
  if (!window.confirm("删除预设：" + (p.name || "预设 " + (index + 1)) + "？")) return;
  presets.splice(index, 1);
  try { savePresets(presets); }
  catch (e) { setStatus("删除预设失败：" + e.message, "err"); return; }
  renderLoadoutPresets();
  setStatus("已删除预设。", "ok");
}

function exportLoadout() {
  if (!root || listKind !== "weapons" || selected.slot < 0) return;
  const preset = currentLoadout();
  preset.name = preset.weaponName || "武器 " + selected.slot;
  const json = JSON.stringify(preset, null, 2);
  downloadBytes(new TextEncoder().encode(json), "weapon_loadout_" + preset.weaponId + ".json");
  setStatus("已导出武器配件预设文件。", "ok");
}

async function importLoadoutFile(file) {
  try { return await withFileOperation(() => importLoadoutFileInternal(file)); }
  catch (e) { setStatus("导入预设失败：" + e.message, "err"); }
}

async function importLoadoutFileInternal(file) {
  try {
    assertFileSize(file, MAX_PRESET_FILE_BYTES, "预设文件");
    const p = parseBoundedJson(await file.text(), MAX_PRESET_JSON_CHARS);
    if (!validatePreset(p)) throw new Error("预设需要包含 13 个配件 ID 的 mods 数组。");
    const list = loadPresets();
    list.push(p);
    savePresets(list);
    if (listKind === "weapons" && selected.slot >= 0) {
      pushHistory("导入预设");
      for (let n = 1; n <= 13; n++) {
        setArrVal("ag_inv_wpn_mod_" + n, selected.slot, p.mods[n - 1] || 0, INVENTORY_LEN);
      }
      renderAll();
    } else {
      renderLoadoutPresets();
    }
    setStatus("已导入预设：" + (p.name || p.weaponName || file.name), "ok");
  } catch (e) {
    setStatus("导入预设失败：" + e.message, "err");
  }
}

function batchSet() {
  if (!root) return;
  const action = batchAction.value;
  const rows = buildRows(listKind).filter(matchesFilter);
  if (!rows.length) {
    setStatus("当前筛选条件下没有条目。", "err");
    return;
  }

  let value = null;
  if (!["clear", "lock", "unlock"].includes(action)) {
    const raw = batchInput.value.trim();
    if (raw === "" || !Number.isInteger(Number(raw)) || Number(raw) < 0) {
      setStatus("批量值必须是大于等于 0 的整数。", "err");
      return;
    }
    value = Number(raw);
  }

  const label = listKind === "characters" ? "角色" : listKind === "weapons" ? "武器" : "模块";
  if (!window.confirm("将对筛选出的 " + rows.length + " 个" + label + "执行“" + action + "”操作？")) return;
  pushHistory("批量操作 " + label);

  if (action === "clear") {
    for (const r of rows) clearSlotValues(listKind, r.slot);
  } else if (action === "count") {
    for (const r of rows) setArrVal("ag_inv_modul_count", r.slot, value, INVENTORY_LEN);
  } else if (action === "id") {
    const key = listKind === "characters" ? "ag_inv_char_id" : "ag_inv_wpn_id";
    for (const r of rows) setArrVal(key, r.slot, value, INVENTORY_LEN);
  } else if (action === "lvl") {
    const key = listKind === "characters" ? "ag_inv_char_lvl" : "ag_inv_wpn_lvl";
    for (const r of rows) setArrVal(key, r.slot, value, INVENTORY_LEN);
  } else if (action === "lock") {
    const key = listKind === "characters" ? "ag_inv_char_lock" : "ag_inv_wpn_lock";
    for (const r of rows) setArrVal(key, r.slot, true, INVENTORY_LEN);
  } else if (action === "unlock") {
    const key = listKind === "characters" ? "ag_inv_char_lock" : "ag_inv_wpn_lock";
    for (const r of rows) setArrVal(key, r.slot, false, INVENTORY_LEN);
  }
  renderAll();
  setStatus("已对 " + rows.length + " 个" + label + "执行批量操作。", "ok");
}

function changePage(delta) {
  page = Math.max(0, page + delta);
  renderTable();
}

function applyDetail() {
  const form = $("detailForm");
  if (!form || !root || selected.slot < 0) return;
  const kind = listKind;
  const slot = selected.slot;
  const errors = [];
  const values = {};

  const readNum = (key) => {
    const el = form.querySelector(`[data-field="${key}"]`);
    if (!el) return undefined;
    const s = el.value.trim();
    if (s === "") return 0;
    const n = Number(s);
    if (!Number.isFinite(n)) errors.push(key + " 不是有效数字。");
    return n;
  };
  const readText = (key) => {
    const el = form.querySelector(`[data-field="${key}"]`);
    return el ? el.value : "";
  };
  const readBool = (key) => {
    const el = form.querySelector(`[data-field="${key}"]`);
    return el ? el.checked : false;
  };

  if (kind === "modules") {
    values.count = readNum("count");
  } else if (kind === "characters") {
    for (const f of CHAR_FIELDS) {
      if (f.picker) {
        const el = form.querySelector(`[data-field="${f.key}"]`);
        const id = el ? parseItemPicker(el, f.picker, true, f.itemType) : null;
        if (id === null) errors.push(f.label + " 必须选择该槽位的有效穿着物品或填写有效 ID（0 为空）。");
        values[f.key] = id;
      } else if (f.type === "bool") values[f.key] = readBool(f.key);
      else if (f.type === "text") values[f.key] = readText(f.key);
      else if (f.type === "vec4") {
        values[f.key] = {
          x: readNum(f.key + ".x"),
          y: readNum(f.key + ".y"),
          z: readNum(f.key + ".z"),
          w: readNum(f.key + ".w")
        };
      } else values[f.key] = readNum(f.key);
    }
  } else if (kind === "weapons") {
    for (const f of WEAPON_FIELDS) {
      if (f.type === "bool") values[f.key] = readBool(f.key);
      else values[f.key] = readNum(f.key);
    }
    for (let n = 1; n <= 13; n++) {
      const el = form.querySelector(`[data-mod="${n}"]`);
      const id = el ? parseItemPicker(el, "module", true) : 0;
      if (id === null) errors.push("配件槽 " + n + " 必须选择有效配件或填写有效 ID。");
      values["ag_inv_wpn_mod_" + n] = id;
    }
  }

  if (errors.length) {
    setStatus("无法应用：" + errors.join(" "), "err");
    return;
  }

  const label = kind === "characters" ? "角色" : kind === "weapons" ? "武器" : "模块";
  pushHistory("编辑" + label + "槽 " + slot);
  if (kind === "modules") {
    setArrVal("ag_inv_modul_count", slot, values.count, INVENTORY_LEN);
  } else {
    const keys = kind === "characters" ? CHAR_FIELDS : WEAPON_FIELDS;
    for (const f of keys) setArrVal(f.key, slot, values[f.key], INVENTORY_LEN);
    if (kind === "weapons") {
      for (let n = 1; n <= 13; n++) {
        setArrVal("ag_inv_wpn_mod_" + n, slot, values["ag_inv_wpn_mod_" + n], INVENTORY_LEN);
      }
    }
  }
  renderAll();
  setStatus("已应用修改到" + label + "槽 " + slot + "。", "ok");
}

function resetDetailForm() {
  renderDetail();
}

function applyOverview() {
  if (!root) return;
  const form = $("overviewForm");
  const errors = [];
  const next = {};
  for (const f of OVERVIEW_FIELDS) {
    const el = form.querySelector(`[data-field="${f.key}"]`);
    if (!el) continue;
    if (f.type === "bool") {
      next[f.key] = el.checked;
    } else if (f.type === "text") {
      next[f.key] = el.value;
    } else {
      const s = el.value.trim();
      const n = s === "" ? 0 : Number(s);
      if (!Number.isFinite(n)) {
        errors.push(f.key + " 不是有效数字。");
        continue;
      }
      next[f.key] = n;
    }
  }
  if (errors.length) {
    setStatus("无法应用设置：" + errors.join(" "), "err");
    return;
  }
  pushHistory("编辑玩家设置");
  Object.assign(root, next);
  renderAll();
  setStatus("已应用玩家设置。", "ok");
}

    root = parsed;
    renderAll();
    setStatus("已从原始 JSON 重新解析。", "ok");

}

}

function formatRaw() {
  try {
    const formatted = JSON.stringify(parseBoundedJson($("rawArea").value), null, 2);
    if (formatted.length > MAX_JSON_CHARS) throw new Error("格式化后的文本超过长度上限，保留原文本。");
    $("rawArea").value = formatted;
    setStatus("已格式化 JSON。", "ok");
  } catch (e) {

}

function getArrIn(rootObj, key) {

}

async function loadCompareFile(file) {

async function loadCompareFileInternal(file) {
  const { parsed } = await readSaveJson(file);
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    throw new Error("对比存档 JSON 必须是对象。");
  }
  assertSaveValid(parsed);
  compareRoot = parsed;
  compareName = file.name;
  compareKind = "characters";
  renderCompare();
  setStatus("已加载对比存档：" + file.name, "ok");
}

function clearCompare() {

}

function arrDiffForKey(key, a, b) {
  const arrA = getArrIn(a, key) || [];
  const arrB = getArrIn(b, key) || [];
  const len = Math.max(arrA.length, arrB.length);
  const out = [];
  for (let i = 0; i < len; i++) {
    const va = arrA[i] == null ? "0" : JSON.stringify(arrA[i]);
    const vb = arrB[i] == null ? "0" : JSON.stringify(arrB[i]);
    if (va !== vb) out.push(i);
  }
  return out;
}

function compareSaveSummary() {
  const out = { chars: [], weapons: [], modules: [], settings: 0 };
  if (!root || !compareRoot) return out;
  const charSet = new Set();
  for (const k of COMPARE_CHAR_KEYS) {
    arrDiffForKey(k, root, compareRoot).forEach((i) => charSet.add(i));
  }
  out.chars = [...charSet].sort((a, b) => a - b);
  const wpnSet = new Set();
  for (const k of COMPARE_WEAPON_KEYS) {
    arrDiffForKey(k, root, compareRoot).forEach((i) => wpnSet.add(i));
  }
  out.weapons = [...wpnSet].sort((a, b) => a - b);
  out.modules = arrDiffForKey("ag_inv_modul_count", root, compareRoot);
  let settings = 0;
  for (const f of OVERVIEW_FIELDS) {
    const a = JSON.stringify(root[f.key] == null ? null : root[f.key]);
    const b = JSON.stringify(compareRoot[f.key] == null ? null : compareRoot[f.key]);
    if (a !== b) settings++;
  }
  out.settings = settings;
  return out;
}

function fmtCompareChar(obj, slot) {
  const id = getArrIn(obj, "ag_inv_char_id") && getArrIn(obj, "ag_inv_char_id")[slot] || 0;
  if (!id) return "空";
  const name = nameOf("character", id, currentLang) || (DATA && DATA.character.prefix[id]) || "";
  const lvl = getArrIn(obj, "ag_inv_char_lvl") && getArrIn(obj, "ag_inv_char_lvl")[slot] || 0;
  const hp = getArrIn(obj, "ag_inv_char_hp") && getArrIn(obj, "ag_inv_char_hp")[slot] || 0;
  return id + " " + name + " Lv" + lvl + " HP" + hp;
}

function fmtCompareWeapon(obj, slot) {
  const id = getArrIn(obj, "ag_inv_wpn_id") && getArrIn(obj, "ag_inv_wpn_id")[slot] || 0;
  if (!id) return "空";
  const name = nameOf("weapon", id, currentLang) || (DATA && DATA.weapon.prefix[id]) || "";
  const lvl = getArrIn(obj, "ag_inv_wpn_lvl") && getArrIn(obj, "ag_inv_wpn_lvl")[slot] || 0;
  const mods = [];
  for (let n = 1; n <= 13; n++) {
    const arr = getArrIn(obj, "ag_inv_wpn_mod_" + n);
    mods.push(arr && arr[slot] || 0);
  }
  return id + " " + name + " Lv" + lvl + " [" + mods.join(",") + "]";
}

function renderCompare() {
  const s = compareSaveSummary();
  $("cmpChars").textContent = s.chars.length;
  $("cmpWeapons").textContent = s.weapons.length;
  $("cmpModules").textContent = s.modules.length;
  $("cmpSettings").textContent = s.settings;
  $("compareName").textContent = compareName ? "对比存档：" + compareName : "未加载对比存档";
  $("btnClearCompare").disabled = !compareRoot;
  document.querySelectorAll(".cmp-tab").forEach((b) =>
    b.classList.toggle("active", b.dataset.cmp === compareKind)
  );
  renderCompareTable();
}

function renderCompareTable() {
  const head = document.querySelector("#compareTable thead");
  const body = document.querySelector("#compareTable tbody");
  if (!root || !compareRoot) {
    head.innerHTML = "<tr><th>槽</th><th>当前存档</th><th>对比存档</th></tr>";
    body.innerHTML = `<tr><td class="empty" colspan="3">请先打开主存档并加载对比存档。</td></tr>`;
    return;
  }
  const s = compareSaveSummary();
  let rows = [];
  if (compareKind === "characters") {
    rows = s.chars.map((slot) => ({ slot, a: fmtCompareChar(root, slot), b: fmtCompareChar(compareRoot, slot) }));
  } else if (compareKind === "weapons") {
    rows = s.weapons.map((slot) => ({ slot, a: fmtCompareWeapon(root, slot), b: fmtCompareWeapon(compareRoot, slot) }));
  } else {
    rows = s.modules.map((slot) => ({
      slot,
      a: getArrIn(root, "ag_inv_modul_count") && getArrIn(root, "ag_inv_modul_count")[slot] || 0,
      b: getArrIn(compareRoot, "ag_inv_modul_count") && getArrIn(compareRoot, "ag_inv_modul_count")[slot] || 0
    }));
  }
  head.innerHTML = "<tr><th>槽</th><th>当前存档</th><th>对比存档</th></tr>";
  if (!rows.length) {
    body.innerHTML = `<tr><td class="empty" colspan="3">该分类没有差异。</td></tr>`;
    return;
  }
  const slice = rows.slice(0, 500);
  body.innerHTML = slice.map((r) =>
    `<tr><td>${r.slot}</td><td>${esc(r.a)}</td><td>${esc(r.b)}</td></tr>`
  ).join("") + (rows.length > 500
    ? `<tr><td class="empty" colspan="3">仅显示前 500 条，共 ${rows.length} 条。</td></tr>`
    : "");
}

function collectArrayRows(key, search, nameType) {
  const arr = getArr(key) || [];
  const q = search.trim().toLowerCase();
  const rows = [];
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    const name = nameType ? nameOf(nameType, i, currentLang) : "";
    const hay = [String(i), String(v), name].join(" ").toLowerCase();
    if ((v !== 0 && v !== "" && v !== false) || (q && hay.includes(q))) {
      rows.push({ i, v, name });
    }
    if (rows.length >= 500) break;
  }
  return rows;
}

function arrayEditorHtml(key, row) {
  if (SAVE_SCHEMA[key]?.type === "bool") {
    return `<input class="arr-edit" data-idx="${row.i}" type="checkbox" ${row.v ? "checked" : ""}>`;
  }
  if (SAVE_SCHEMA[key]?.type === "formation") {
    return `<span>编队对象（请在原始 JSON 页编辑，提交时校验）</span>`;
  }
  return `<input class="arr-edit" data-idx="${row.i}" type="number" step="1" value="${esc(row.v)}">`;
}

function renderIntArrayRows(tableId, key, search, nameType) {

function applyArrayEdits(tableId, key) {
  const inputs = document.querySelectorAll("#" + tableId + " .arr-edit");
  if (!inputs.length) {
    setStatus("当前没有可应用的条目。", "err");
    return;
  }
  const vals = [];
  for (const input of inputs) {
    const idx = Number(input.dataset.idx);
    if (SAVE_SCHEMA[key]?.type === "bool") {
      vals.push({ idx, v: input.checked });
      continue;
    }
    const s = input.value.trim();
    const v = s === "" ? 0 : Number(s);
    if (!Number.isInteger(v)) {
      setStatus("数组值必须是整数。", "err");
      return;
    }
    vals.push({ idx, v });
  }
  pushHistory("编辑数组 " + key);
  for (const item of vals) setArrVal(key, item.idx, item.v, INVENTORY_LEN);
  renderFieldTab();
  setStatus("已应用数组修改：" + key, "ok");
}

function renderCards() {
